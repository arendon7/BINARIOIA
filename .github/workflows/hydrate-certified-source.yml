name: Hydrate certified R26 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    if: github.ref_name == 'chore/r27-import-full-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/r27-import-full-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hydrate only missing certified source
        run: bash scripts/hydrate_certified_source.sh "$GITHUB_WORKSPACE"
      - name: Reject accidental deletion or overwrite of tracked R27 work
        run: |
          test -z "$(git diff --diff-filter=DM --name-only HEAD)" || {
            echo 'Hydration deleted or modified tracked files. R27 must win conflicts.'
            git diff --diff-filter=DM --name-status HEAD
            exit 4
          }
      - name: Commit hydrated missing paths
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No missing source paths remained to hydrate.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(source): hydrate remaining certified R26 source paths'
          git push origin HEAD:chore/r27-import-full-source
