name: R27 FULL MAC UAT build

on:
  push:
    branches: ['chore/r27-uat-build']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile release builder
        run: python -m py_compile scripts/build_r27_uat.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: R27 regression
        run: python -m pytest tests -q
      - name: Historical Apps regression
        run: python -m pytest apps -q
      - name: Canonical source gate
        run: python scripts/release_gate.py --repo .

  build-full-mac-uat:
    needs: certify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch certified R26 FULL MAC baseline
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown 1ApcRRY0zVL3bJ_ifyXb_xjPRjNJb7I_H -O baseline-r26.zip
          echo '87b36e06e896fbbb07309e9947a4113771515cb534cfa6e525446b7a21f97c46  baseline-r26.zip' | shasum -a 256 -c -
      - name: Build R27 UAT from certified baseline
        run: |
          python scripts/build_r27_uat.py --repo . --baseline baseline-r26.zip --dist dist --source-sha "$GITHUB_SHA"
      - name: Structural Mac validation
        run: |
          rm -rf /tmp/r27-uat-check && mkdir -p /tmp/r27-uat-check
          unzip -q dist/BINARIO_IA_v0.27.0_R27_FULL_MAC_UAT.zip -d /tmp/r27-uat-check
          ROOT='/tmp/r27-uat-check/BINARIO_IA_v0.27.0_R27_FULL_MAC_UAT'
          python -m py_compile "$ROOT/installer/install_standalone.py"
          plutil -lint "$ROOT/INSTALAR BINARIO IA R27 UAT.app/Contents/Info.plist"
          zsh -n "$ROOT/INSTALAR_BINARIO_IA_R27_FULL_MAC_UAT.command"
          zsh -n "$ROOT/INSTALAR BINARIO IA R27 UAT.app/Contents/MacOS/launch"
          zsh -n "$ROOT/payload/Binario IA R27 UAT/ABRIR_BINARIO_IA_R27.command"
          test -d "$ROOT/payload/Binario IA R27 UAT/apps/11_documentos_ia"
          test -f "$ROOT/payload/Binario IA R27 UAT/runtime/runtime_manager.py"
          test -f "$ROOT/payload/Binario IA R27 UAT/runtime/whisper_gateway.py"
          test -f "$ROOT/payload/Binario IA R27 UAT/runtime/whisper_selftest.py"
          cat dist/BINARIO_IA_v0.27.0_R27_FULL_MAC_UAT.zip.sha256.txt
      - name: Upload R27 FULL MAC UAT
        uses: actions/upload-artifact@v4
        with:
          name: BINARIO-IA-R27-FULL-MAC-UAT
          path: |
            dist/BINARIO_IA_v0.27.0_R27_FULL_MAC_UAT.zip
            dist/BINARIO_IA_v0.27.0_R27_FULL_MAC_UAT.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
