name: R27 APP11 gdown probe

on:
  push:
    branches: ['fix/r27-post-merge-regression']
    paths: ['.github/workflows/r27-app11-gdown-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Drive file through gdown
        run: |
          python -m pip install -q gdown
          gdown 1ufivwWBMohoPzaNj_8maCWWe8MTEQxrt -O /tmp/custody.bin
          ls -lh /tmp/custody.bin
          file /tmp/custody.bin
          sha256sum /tmp/custody.bin
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/custody.bin')
          b=p.read_bytes()[:64]
          print('MAGIC', b.hex())
          print('PREFIX', repr(b))
          PY
      - name: Test gzip/tar structure
        run: |
          mkdir -p /tmp/custody-extracted
          tar -tzf /tmp/custody.bin | head -n 30
          tar -xzf /tmp/custody.bin -C /tmp/custody-extracted
          find /tmp/custody-extracted -type d -path '*/apps/11_documentos_ia' -print
