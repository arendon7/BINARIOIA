name: R27 export exact source

on:
  push:
    branches: ['chore/r27-uat-build']
    paths: ['.github/workflows/r27-export-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record source identity
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          git ls-files -z | tar --null -T - -czf BINARIOIA_R27_GIT_SOURCE.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: BINARIOIA-R27-GIT-SOURCE
          path: |
            BINARIOIA_R27_GIT_SOURCE.tar.gz
            SOURCE_SHA.txt
          compression-level: 0
          retention-days: 7
