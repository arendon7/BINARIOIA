name: R27 development gates

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical development metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('config/development.json'),
              Path('config/R26_SOURCE_BASELINE_MAP.json'),
              Path('docs/BASELINE_R26.md'),
              Path('docs/R27_DEVELOPMENT_LEDGER.md'),
              Path('scripts/release_gate.py'),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          assert not missing, f'Missing governance files: {missing}'
          data = json.loads(Path('config/development.json').read_text())
          assert data.get('canonical_repository') == 'arendon7/BINARIOIA'
          assert data.get('development_branch') == 'develop'
          assert data.get('stable_branch') == 'main'
          print('Governance PASS')
          PY
      - name: Compile repository gate scripts
        run: python -m py_compile scripts/release_gate.py scripts/import_certified_baseline.py

  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect source hydration state
        id: source
        shell: bash
        run: |
          required=(
            apps common hub runtime r26 tests
            hub/server.py hub/ui/projects.html
            r26/r26_core/project_center.py r26/r26_core/preferences.py
            r26/r26_video_studio/server.py
            r26/r26_video_studio/video-studio.js
            r26/r26_video_studio/video-studio.css
          )
          missing=()
          for p in "${required[@]}"; do
            [[ -e "$p" ]] || missing+=("$p")
          done
          if (( ${#missing[@]} == 0 )); then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'R27 executable source hydration complete enough for core regression.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            printf 'Partial source hydration; deferring full R27 regression until these dependencies exist:\n - %s\n' "${missing[*]}"
          fi
      - name: Install pytest
        if: steps.source.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run core/R27 tests when executable source is hydrated
        if: steps.source.outputs.present == 'true'
        run: python -m pytest tests -q --junitxml=r27-pytest.xml
      - name: Persist R27 pytest report
        if: always() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r27-pytest-report
          path: r27-pytest.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify twelve application source directories
        if: steps.source.outputs.present == 'true'
        run: python scripts/release_gate.py --repo .

  release-fail-closed:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full source is mandatory for a release
        run: python scripts/release_gate.py --repo .
      - name: Block releases while source-import blocker marker exists
        run: |
          test ! -f .release-blocked || { cat .release-blocked; exit 2; }
