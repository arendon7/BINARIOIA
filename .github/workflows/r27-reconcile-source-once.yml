name: R27 reconcile certified source once

on:
  push:
    branches: ['chore/r27-uat-build']
    paths:
      - '.custody/**'
      - '.github/workflows/r27-reconcile-source-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ hashFiles('.custody/r26-source.part-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/r27-uat-build
      - name: Rebuild authenticated custody archive
        run: |
          cat .custody/r26-source.part-* > /tmp/r26_source_snapshot.tar.xz
          echo 'cbfbfe2d6df9310f28647d78f39e57ee532200bf254064b92f9e61dfcc7c955c  /tmp/r26_source_snapshot.tar.xz' | sha256sum -c -
          mkdir -p /tmp/r26-source
          tar -xJf /tmp/r26_source_snapshot.tar.xz -C /tmp/r26-source
      - name: Fill only missing certified R26 source
        run: |
          rsync -a --ignore-existing \
            --exclude '.git/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache/' \
            /tmp/r26-source/ "$GITHUB_WORKSPACE"/
      - name: Verify certified source parity floors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          spec=json.loads((root/'config/R26_SOURCE_SNAPSHOT_MAP.json').read_text())
          failures=[]
          for name,row in spec['sections'].items():
              p=root/name
              count=sum(1 for x in p.rglob('*') if x.is_file()) if p.exists() else 0
              if count < row['files']:
                  failures.append((name,count,row['files']))
          for name,row in spec['apps'].items():
              p=root/'apps'/name
              count=sum(1 for x in p.rglob('*') if x.is_file()) if p.exists() else 0
              if count < row['files']:
                  failures.append(('apps/'+name,count,row['files']))
          assert not failures, failures
          print('Certified source parity floors PASS')
          PY
      - name: Preserve R27 conflicts and commit reconciled source
        run: |
          test -z "$(git diff --diff-filter=M --name-only HEAD -- ':!config/R26_SOURCE_SNAPSHOT_SHA256.txt')" || {
            echo 'Hydration modified tracked R27 files.'
            git diff --diff-filter=M --name-status HEAD
            exit 4
          }
          rm -rf .custody
          rm -f .github/workflows/r27-reconcile-source-once.yml
          printf '%s\n' 'b854a8316ecc1003ea9f2806ceb9dea229c9f276f881b942dad3dc2c46e30f87' > config/R26_SOURCE_SNAPSHOT_SHA256.txt
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(source): reconcile certified R26 source custody for R27'
          git push origin HEAD:chore/r27-uat-build
