name: R27 APP11 forensic recovery

on:
  push:
    branches: ['fix/r27-post-merge-regression']
    paths: ['.github/workflows/r27-app11-forensic.yml']

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current custody snapshot without trusting global SHA
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.google.com/uc?export=download&id=1ufivwWBMohoPzaNj_8maCWWe8MTEQxrt'
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 "$url" -o /tmp/R26_SOURCE_TEXT.tar.gz
          sha256sum /tmp/R26_SOURCE_TEXT.tar.gz
          mkdir -p /tmp/r26-current
          tar -xzf /tmp/R26_SOURCE_TEXT.tar.gz -C /tmp/r26-current
      - name: Fingerprint APP11 and derive baseline tree algorithm
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          repo = Path('.').resolve()
          baseline = json.loads((repo/'config/R26_SOURCE_BASELINE_MAP.json').read_text())
          expected = baseline['apps']['11_documentos_ia']
          roots = [p for p in Path('/tmp/r26-current').rglob('11_documentos_ia') if p.is_dir() and p.parent.name == 'apps']
          if len(roots) != 1:
              raise SystemExit(f'Expected exactly one apps/11_documentos_ia in snapshot; got {roots}')
          app11 = roots[0]

          def files(root: Path):
              return sorted((p for p in root.rglob('*') if p.is_file()), key=lambda p: p.relative_to(root).as_posix())
          def stats(root: Path):
              fs = files(root)
              return len(fs), sum(p.stat().st_size for p in fs)
          got_stats = stats(app11)
          print('APP11_ROOT', app11)
          print('APP11_STATS', got_stats, 'EXPECTED', (expected['files'], expected['bytes']))
          if got_stats != (expected['files'], expected['bytes']):
              raise SystemExit('APP11 count/bytes do not match canonical baseline')

          def variants(root: Path):
              fs = files(root)
              rows = []
              for p in fs:
                  rel = p.relative_to(root).as_posix()
                  b = p.read_bytes()
                  rows.append((rel, b, len(b), hashlib.sha256(b).hexdigest(), hashlib.sha256(b).digest()))
              out = {}
              def digest_chunks(name, chunks):
                  h = hashlib.sha256()
                  for c in chunks:
                      h.update(c)
                  out[name] = h.hexdigest()
              digest_chunks('rel0raw', (x for r,b,n,sh,sd in rows for x in (r.encode(), b'\0', b)))
              digest_chunks('relNLraw', (x for r,b,n,sh,sd in rows for x in (r.encode(), b'\n', b)))
              digest_chunks('relraw', (x for r,b,n,sh,sd in rows for x in (r.encode(), b)))
              digest_chunks('rel0shahex', (x for r,b,n,sh,sd in rows for x in (r.encode(), b'\0', sh.encode())))
              digest_chunks('relNLshahex', (x for r,b,n,sh,sd in rows for x in (r.encode(), b'\n', sh.encode())))
              digest_chunks('rel0shabin', (x for r,b,n,sh,sd in rows for x in (r.encode(), b'\0', sd)))
              digest_chunks('sha2space_rel_NL', (f'{sh}  {r}\n'.encode() for r,b,n,sh,sd in rows))
              digest_chunks('sha1space_rel_NL', (f'{sh} {r}\n'.encode() for r,b,n,sh,sd in rows))
              digest_chunks('rel_tab_size_tab_sha_NL', (f'{r}\t{n}\t{sh}\n'.encode() for r,b,n,sh,sd in rows))
              digest_chunks('rel0size0sha', (x for r,b,n,sh,sd in rows for x in (r.encode(), b'\0', str(n).encode(), b'\0', sh.encode())))
              manifests = {
                  'json_rel_sha_default': [{'path':r,'sha256':sh} for r,b,n,sh,sd in rows],
                  'json_rel_size_sha_default': [{'path':r,'bytes':n,'sha256':sh} for r,b,n,sh,sd in rows],
                  'json_rel_sha_compact': [{'path':r,'sha256':sh} for r,b,n,sh,sd in rows],
                  'json_rel_size_sha_compact': [{'path':r,'bytes':n,'sha256':sh} for r,b,n,sh,sd in rows],
              }
              out['json_rel_sha_default'] = hashlib.sha256(json.dumps(manifests['json_rel_sha_default'], sort_keys=True).encode()).hexdigest()
              out['json_rel_size_sha_default'] = hashlib.sha256(json.dumps(manifests['json_rel_size_sha_default'], sort_keys=True).encode()).hexdigest()
              out['json_rel_sha_compact'] = hashlib.sha256(json.dumps(manifests['json_rel_sha_compact'], sort_keys=True, separators=(',',':')).encode()).hexdigest()
              out['json_rel_size_sha_compact'] = hashlib.sha256(json.dumps(manifests['json_rel_size_sha_compact'], sort_keys=True, separators=(',',':')).encode()).hexdigest()
              return out

          eligible = []
          for name, meta in baseline['apps'].items():
              root = repo/'apps'/name
              if root.is_dir() and stats(root) == (meta['files'], meta['bytes']):
                  eligible.append((name, root, meta['tree_sha256']))
          print('ELIGIBLE_CANONICAL_STATS', [n for n,_,_ in eligible])
          if len(eligible) < 2:
              raise SystemExit('Not enough untouched apps to derive tree algorithm safely')
          sample_variants = {name: variants(root) for name,root,_ in eligible[:4]}
          common = None
          for name,root,target in eligible[:4]:
              matching = {alg for alg,d in sample_variants[name].items() if d == target}
              print('MATCHING_ALGORITHMS', name, sorted(matching))
              common = matching if common is None else common & matching
          common = common or set()
          if len(common) != 1:
              print('Could not uniquely derive tree algorithm; candidate APP11 metrics are exact but recovery remains blocked.')
              print('APP11_VARIANTS', json.dumps(variants(app11), indent=2, sort_keys=True))
              raise SystemExit(8)
          alg = next(iter(common))
          actual_tree = variants(app11)[alg]
          print('DERIVED_ALGORITHM', alg)
          print('APP11_TREE', actual_tree)
          print('EXPECTED_TREE', expected['tree_sha256'])
          if actual_tree != expected['tree_sha256']:
              raise SystemExit('APP11 tree hash differs from canonical baseline')
          print('APP11 CANONICAL MATCH: file count, bytes and cryptographic tree hash all PASS')
          PY
      - name: Archive verified candidate for inspection
        if: always()
        shell: bash
        run: |
          root="$(find /tmp/r26-current -type d -path '*/apps/11_documentos_ia' -print -quit || true)"
          if [[ -n "$root" ]]; then
            mkdir -p /tmp/app11-artifact/apps
            cp -a "$root" /tmp/app11-artifact/apps/
            (cd /tmp/app11-artifact && zip -qr /tmp/app11-candidate.zip apps)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r27-app11-forensic-candidate
          path: /tmp/app11-candidate.zip
          if-no-files-found: warn
          retention-days: 7
