<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binario IA · Proyectos</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/r27.css"></head><body><main class="shell"><header class="top"><div><a class="eyebrow" href="/">← Inicio</a><h1>Proyectos</h1><p class="muted">Todo tu trabajo en una sola carpeta física. Video Studio recibe el mismo project_id que eliges aquí.</p></div><div class="actions"><button class="btn" onclick="openRoot()">Abrir en Finder</button><a class="btn" href="/apps">12 Apps</a></div></header><section class="grid"><div class="card"><h3>Nuevo proyecto</h3><input id="name" placeholder="Nombre"><select id="app"></select><button class="btn primary" onclick="createProject()">Crear</button><p class="muted" id="root">~/Documents/Binario IA/Projects</p></div><div class="card"><h3>Buscar</h3><input id="search" placeholder="Nombre, App o proyecto…" oninput="render()"><p class="muted">Los proyectos se conservan aunque desinstales Binario IA.</p></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Continuar</div><h2>Proyectos existentes</h2></div></div><div id="rows" class="recent-projects"></div></section></main><script>
let APPS=[],PROJECTS=[];const $=id=>document.getElementById(id);async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}async function post(u,b={}){let r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok||j.error)throw Error(j.error||`HTTP ${r.status}`);return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function appFor(id){return APPS.find(a=>a.id===id)||{id,name:id||'Proyecto'}}async function openProject(p){let a=appFor(p.app_id);if(a.special_service){let r=await post('/api/launch/'+encodeURIComponent(a.id),{project_id:p.id});if(r.url){if(a.id==='05-editor-video-ia')location.href=r.url;else{let w=window.open(r.url,'_blank','noopener');if(!w)location.href=r.url}}}else location.href='/app/'+encodeURIComponent(a.id)+'?project='+encodeURIComponent(p.id)}function render(){let q=$('search').value.trim().toLowerCase();let rows=PROJECTS.filter(p=>!q||`${p.name} ${p.id} ${p.app_id}`.toLowerCase().includes(q));$('rows').innerHTML=rows.length?rows.map(p=>{let a=appFor(p.app_id),path=p.metadata?.project_path||'';return `<article class="recent-card"><div class="app-kicker">${esc(a.name||p.app_id)}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.id)} · ${esc((p.updated_at||'').replace('T',' ').slice(0,16))}</p>${path?`<p class="muted" title="${esc(path)}">${esc(path)}</p>`:''}<div class="actions"><button class="btn primary" onclick='openProject(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Continuar</button><button class="btn" onclick="archiveProject('${p.id}')">Archivar</button></div></article>`}).join(''):'<div class="loading-card">No hay proyectos con ese filtro.</div>'}async function createProject(){let app=$('app').value,name=$('name').value.trim()||'Nuevo proyecto';let p=await post('/api/projects/create',{name,app_id:app});PROJECTS.unshift(p);render();await openProject(p)}async function archiveProject(id){await post('/api/projects/'+encodeURIComponent(id)+'/archive');PROJECTS=await get('/api/projects');render()}async function openRoot(){try{await post('/api/open-projects-root')}catch(e){alert(e.message)}}async function boot(){[APPS,PROJECTS]=await Promise.all([get('/api/apps'),get('/api/projects')]);let root=await get('/api/projects/root').catch(()=>({}));$('root').textContent=root.root||'~/Documents/Binario IA/Projects';$('app').innerHTML=APPS.map(a=>`<option value="${esc(a.id)}" ${a.id==='05-editor-video-ia'?'selected':''}>${String(a.number||'').padStart(2,'0')} · ${esc(a.name)}</option>`).join('');render()}boot().catch(e=>$('rows').innerHTML=`<div class="error-card">${esc(e.message)}</div>`);
</script></body></html>
